# Application Name
spring.application.name=MasterChefAPI

# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://admin:admin@masterchef.oi89jax.mongodb.net/?retryWrites=true&w=majority&appName=MASTERCHEF
spring.data.mongodb.database=MASTERCHEF

# MongoDB Auto-index creation
spring.data.mongodb.auto-index-creation=true

# JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false
springdoc.override-with-generic-response=false